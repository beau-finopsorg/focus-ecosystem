name: Broken or moved link
description: Report a dead link or one that now redirects somewhere else.
title: "[Link] "
labels: ["broken-link"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: The link as it appears in the index.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: For example, a 404, a redirect, a parked domain, or a changed owner.
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: Suggested replacement URL
      description: If you know it. Please open it first to check.
      placeholder: https://
    validations:
      required: false
