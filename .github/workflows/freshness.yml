name: Link freshness

on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: freshness
  cancel-in-progress: false

env:
  BRANCH: bot/freshness

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Record when each linked resource last changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_freshness.py
      - run: python3 scripts/build_readme.py
      # main is protected, so dates land through a pull request that must pass the README check.
      - name: Open or update the freshness pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add registry/freshness.json README.md
          git commit -m "Update link freshness dates"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "Update link freshness dates" \
              --body "Weekly refresh of when each linked resource last changed. Generated by the Link freshness workflow."
          fi
          # Pushes made with GITHUB_TOKEN do not trigger pull_request workflows, so run the required check directly.
          gh workflow run readme-check.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch || echo "Auto-merge is off. Merge the pull request by hand."
