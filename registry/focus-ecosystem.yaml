# Source of truth for the FOCUS ecosystem index.
# README.md is generated from this file: run `python3 scripts/build_readme.py`.
# Fields: id, name, category, url, description, kind (repo|site|tool|doc|program|community|package|provider),
#         owner (who maintains it), status (active|archived|internal|unverified), verified (YYYY-MM-DD).
# Use status "unverified" for anything not confirmed first-hand; CI lists these in the backlog.

categories:
  - id: spec
    title: Specification
    blurb: The normative FOCUS specification, its releases, and its source.
  - id: columns
    title: Column Library and Data Model
    blurb: Column definitions, schema reference, and machine-readable access.
  - id: usecases
    title: Use Case Library
    blurb: FinOps scenarios with SQL queries written against FOCUS columns.
  - id: sandbox
    title: Sandbox and Sample Data
    blurb: Anonymized real FOCUS billing data you can query or download.
  - id: validator
    title: Validator
    blurb: Check a dataset against a specific FOCUS version.
  - id: converters
    title: Converters and Mapping
    blurb: Turn native billing data into FOCUS.
  - id: tooling
    title: Other Tools
    blurb: Supporting utilities, requirements tooling, and AI access.
  - id: conformance
    title: Conformance and Governance
    blurb: Certification, project charter, and contribution mechanics.
  - id: adoption
    title: Adoption and Guides
    blurb: Who produces and consumes FOCUS, and how to start.
  - id: community
    title: Community
    blurb: Where to ask questions and give feedback.

